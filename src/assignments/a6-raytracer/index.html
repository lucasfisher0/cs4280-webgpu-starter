<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css"/>     <!-- ROOT STYLESHEET -->
  <title>Assignment 6 — Ray Tracing · CS 4280</title>

<body class="bg-zinc-800 min-h-screen flex flex-col items-center p-6 font-sans">
<script>
  function toggleVisibility(id) {
    const elem = document.getElementById(id);
    if (elem)
      elem.toggleAttribute("collapsed");
  }
</script>

<main class="w-full max-w-2xl border border-zinc-800 rounded-xl overflow-hidden shadow-2xl relative">
  <a class="back-link" href="/">← Back to course home</a>
  <h1>Assignment 6 — Ray Tracing</h1>

  <div class="relative aspect-[16/10] bg-black canvas-frame drag-surface" id="canvasFrame">
    <canvas id="gpu-canvas" class="w-full h-full touch-none cursor-grab active:cursor-grabbing block"></canvas>
    <p id="status" class="status-overlay" hidden></p>
  </div>

  <div class="flex justify-between items-center px-4 py-2 border-t border-zinc-800 text-xs text-zinc-500">
    <span>Drag on canvas to orbit view</span>
    <span id="fps-label">FPS: --</span>
  </div>
</main>

<script type="module" src="./index.ts"></script>
</body>
</html>
