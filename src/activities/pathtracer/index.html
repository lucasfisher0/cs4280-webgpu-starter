<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Path Tracer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-800 min-h-screen flex flex-col items-center p-6 font-sans">
  <header class="text-center mb-4">
    <h1 class="text-2xl font-bold text-white">Path Tracer</h1>
    <p class="text-xs text-zinc-400 mt-1">Starting point: a Module 10 ray tracer on the GPU (point light, hard
      shadows, a mirror ball), one compute thread per pixel</p>
  </header>

  <main class="w-full max-w-lg border border-zinc-800 rounded-xl overflow-hidden shadow-2xl">
    <canvas id="gpu-canvas" width="400" height="400" class="w-full aspect-square block bg-black"></canvas>
    <div id="info" class="px-4 py-2 border-t border-zinc-800 text-xs text-zinc-500"></div>
  </main>

  <nav class="w-full max-w-lg flex justify-between mt-4">
    <span></span>
    <a href="./step1.html" class="text-sm text-sky-400 hover:text-sky-300">Step 1 &rarr;</a>
  </nav>

  <script type="module">
    import GUI from "lil-gui";
    import { initializeWebGPU } from "@/lib/webgpu.js";

    // Image size, baked into the shaders as text.
    const W = 400, H = 400;

    const state = {
      exposure: 1.0,    // display brightness
      maxDepth: 4,      // max bounces per ray (mirror inside mirror, ...)
      maxFrames: 1024,  // stop after this many frames
    };

    // ======================= WGSL =======================

    // Uniforms. Each vec3 is padded to 16 bytes by the 4-byte field after it:
    //   0 e (eye) vec3,   12 tanHalf f32
    //  16 u vec3,         28 exposure f32
    //  32 v vec3,         44 frame u32
    //  48 w vec3,         60 maxDepth u32
    const wgslParams = /* wgsl */ `
      struct Params {
        e: vec3f, tanHalf: f32,
        u: vec3f, exposure: f32,
        v: vec3f, frame: u32,
        w: vec3f, maxDepth: u32,
      };
      @group(0) @binding(0) var<uniform> P: Params;
    `;

    // ---- The scene: a room of 6 quads, 2 spheres and a box ----
    const wgslScene = /* wgsl */ `
      const PI = 3.14159265;
      const EPS = 1e-3;

      // How a material scatters light.
      const DIFFUSE = 0u;
      const METAL = 1u;     // smooth metal: mirror reflection tinted by its color

      struct Material { albedo: vec3f, kind: u32, emitted: vec3f };
      struct Quad { corner: vec3f, e1: vec3f, e2: vec3f, mat: u32 };
      struct Sphere { center: vec3f, radius: f32, mat: u32 };
      struct Box { center: vec3f, half: vec3f, angle: f32, mat: u32 };   // turned by angle about y
      struct Ray { o: vec3f, d: vec3f };
      struct Hit { t: f32, n: vec3f, mat: i32 };   // mat = -1: missed

      var<private> materials: array<Material, 7> = array<Material, 7>(
        Material(vec3f(0.73), DIFFUSE, vec3f(0.0)),               // 0 white
        Material(vec3f(0.65, 0.06, 0.05), DIFFUSE, vec3f(0.0)),   // 1 red
        Material(vec3f(0.12, 0.45, 0.15), DIFFUSE, vec3f(0.0)),   // 2 green
        Material(vec3f(0.0), DIFFUSE, vec3f(40.0, 35.0, 26.0)),   // 3 light panel (sized for the 3x3x3 room)
        Material(vec3f(0.95), METAL, vec3f(0.0)),                 // 4 big ball: silver mirror
        Material(vec3f(0.73), DIFFUSE, vec3f(0.0)),               // 5 middle ball
        Material(vec3f(0.15, 0.3, 0.75), DIFFUSE, vec3f(0.0)));    // 6 cube: blue paint

      // The room is x in [-1.5, 1.5], y in [0, 3], z in [-1.5, 1.5]; its front is open.
      const LIGHT = 5;   // index of the light panel in quads
      var<private> quads: array<Quad, 6> = array<Quad, 6>(
        Quad(vec3f(-1.5, 0.0, -1.5), vec3f(3.0, 0.0, 0.0), vec3f(0.0, 0.0, 3.0), 0u),   // floor
        Quad(vec3f(-1.5, 3.0, -1.5), vec3f(3.0, 0.0, 0.0), vec3f(0.0, 0.0, 3.0), 0u),   // ceiling
        Quad(vec3f(-1.5, 0.0, -1.5), vec3f(3.0, 0.0, 0.0), vec3f(0.0, 3.0, 0.0), 0u),   // back
        Quad(vec3f(-1.5, 0.0, -1.5), vec3f(0.0, 0.0, 3.0), vec3f(0.0, 3.0, 0.0), 1u),   // left
        Quad(vec3f(1.5, 0.0, -1.5), vec3f(0.0, 0.0, 3.0), vec3f(0.0, 3.0, 0.0), 2u),    // right
        Quad(vec3f(-0.4, 2.99, -0.4), vec3f(0.8, 0.0, 0.0), vec3f(0.0, 0.0, 0.8), 3u)); // light (faces down)

      var<private> spheres: array<Sphere, 2> = array<Sphere, 2>(
        Sphere(vec3f(-0.7, 0.5, -0.5), 0.5, 4u),
        Sphere(vec3f(0.65, 0.45, -0.1), 0.45, 5u));

      // A 0.6 painted cube resting on the floor, turned 30 degrees.
      var<private> boxes: array<Box, 1> = array<Box, 1>(
        Box(vec3f(-0.1, 0.3, 0.8), vec3f(0.3), radians(30.0), 6u));

      // Ray-parallelogram: hit the plane, then check both edge coordinates are in [0, 1].
      fn hitQuad(q: Quad, r: Ray, tmax: f32) -> f32 {
        let n = cross(q.e1, q.e2);
        let denom = dot(n, r.d);
        if (abs(denom) < 1e-8) { return -1.0; }
        let t = dot(q.corner - r.o, n) / denom;
        if (t < EPS || t > tmax) { return -1.0; }
        let rel = r.o + t * r.d - q.corner;
        let a = dot(rel, q.e1) / dot(q.e1, q.e1);
        let b = dot(rel, q.e2) / dot(q.e2, q.e2);
        if (a < 0.0 || a > 1.0 || b < 0.0 || b > 1.0) { return -1.0; }
        return t;
      }

      // Ray-sphere (Module 10), with a unit-length direction.
      fn hitSphere(s: Sphere, r: Ray, tmax: f32) -> f32 {
        let ec = r.o - s.center;
        let B = dot(r.d, ec);
        let disc = B * B - (dot(ec, ec) - s.radius * s.radius);
        if (disc < 0.0) { return -1.0; }
        var t = -B - sqrt(disc);
        if (t < EPS) { t = -B + sqrt(disc); }   // ray starts inside the sphere
        if (t < EPS || t > tmax) { return -1.0; }
        return t;
      }

      // Rotate v by angle a about the y axis.
      fn rotY(v: vec3f, a: f32) -> vec3f {
        let c = cos(a);
        let s = sin(a);
        return vec3f(c * v.x + s * v.z, v.y, -s * v.x + c * v.z);
      }

      // Ray-box (Module 10's slabs), after turning the ray into the box's own frame.
      fn hitBox(b: Box, r: Ray, tmax: f32) -> Hit {
        let miss = Hit(-1.0, vec3f(0.0), -1);
        let o = rotY(r.o - b.center, -b.angle);
        let d = rotY(r.d, -b.angle);
        let inv = 1.0 / select(d, vec3f(1e-8), abs(d) < vec3f(1e-8));   // avoid dividing by 0
        let t1 = (-b.half - o) * inv;
        let t2 = (b.half - o) * inv;
        let tlo = min(t1, t2);
        let thi = max(t1, t2);
        let tnear = max(max(tlo.x, tlo.y), tlo.z);
        let tfar = min(min(thi.x, thi.y), thi.z);
        if (tnear > tfar) { return miss; }
        let t = select(tfar, tnear, tnear > EPS);   // tfar when the ray starts inside
        if (t < EPS || t > tmax) { return miss; }
        // Face normal: the axis where the hit point is farthest out (relative to the size).
        let p = (o + t * d) / b.half;
        let a = abs(p);
        var n = vec3f(0.0, 0.0, sign(p.z));
        if (a.x >= a.y && a.x >= a.z) {
          n = vec3f(sign(p.x), 0.0, 0.0);
        } else if (a.y >= a.z) {
          n = vec3f(0.0, sign(p.y), 0.0);
        }
        return Hit(t, rotY(n, b.angle), i32(b.mat));   // normal back to world space
      }

      // Closest hit over everything in the scene.
      fn sceneHit(r: Ray, tmaxIn: f32) -> Hit {
        var h = Hit(-1.0, vec3f(0.0), -1);
        var tmax = tmaxIn;
        for (var i = 0; i < 6; i++) {
          let t = hitQuad(quads[i], r, tmax);
          if (t > 0.0) { tmax = t; h = Hit(t, normalize(cross(quads[i].e1, quads[i].e2)), i32(quads[i].mat)); }
        }
        for (var i = 0; i < 2; i++) {
          let t = hitSphere(spheres[i], r, tmax);
          if (t > 0.0) { tmax = t; h = Hit(t, (r.o + t * r.d - spheres[i].center) / spheres[i].radius, i32(spheres[i].mat)); }
        }
        for (var i = 0; i < 1; i++) {
          let hb = hitBox(boxes[i], r, tmax);
          if (hb.t > 0.0) { tmax = hb.t; h = hb; }
        }
        return h;
      }
    `;

    // ---- Module 10 shading: a point light just under the panel ----
    //   c = kd (alpha + (1 - alpha) max(0, n·l)) + ks max(0, n·h)^p
    // with a shadow ray deciding whether the light is visible.
    const wgslShading = /* wgsl */ `
      const LIGHT_POS = vec3f(0.0, 2.9, 0.0);
      const ALPHA = 0.15;            // ambient fraction
      const KS = 0.4;                // highlight strength
      const SHININESS = 32.0;

      fn shade(x: vec3f, n: vec3f, v: vec3f, kd: vec3f) -> vec3f {
        let toL = LIGHT_POS - x;
        let r = length(toL);
        let l = toL / r;
        let blocker = sceneHit(Ray(x, l), r);
        if (blocker.mat >= 0) { return kd * ALPHA; }     // in shadow: ambient only
        let h = normalize(l + v);
        return kd * (ALPHA + (1.0 - ALPHA) * max(dot(n, l), 0.0))
             + KS * pow(max(dot(n, h), 0.0), SHININESS);
      }
    `;

    // ---- Tracing: a loop instead of recursion ----
    // beta is how much of the final color this ray carries (a mirror passes on 95%).
    const wgslRadiance = /* wgsl */ `
      fn radiance(primary: Ray) -> vec3f {
        var ray = primary;
        var L = vec3f(0.0);
        var beta = vec3f(1.0);
        for (var depth = 0u; depth < P.maxDepth; depth++) {
          let h = sceneHit(ray, 1e30);
          if (h.mat < 0) { break; }                  // out the open front: black
          let m = materials[h.mat];
          let x = ray.o + h.t * ray.d;

          // Looking straight at the light panel.
          if (any(m.emitted > vec3f(0.0))) {
            if (dot(ray.d, h.n) < 0.0) { L += beta * m.emitted; }
            break;
          }

          if (m.kind == METAL) {
            beta *= m.albedo;
            ray = Ray(x, reflect(ray.d, h.n));
          } else {
            let n = select(h.n, -h.n, dot(h.n, ray.d) > 0.0);   // normal facing the ray
            L += beta * shade(x, n, -ray.d, m.albedo);
            break;
          }
        }
        return L;
      }
    `;

    // ---- Camera ray through pixel (px, py) in [-1, 1] ----
    const wgslCamera = /* wgsl */ `
      fn cameraRay(px: f32, py: f32) -> Ray {
        let dir = normalize(-P.w + px * P.tanHalf * P.u + py * P.tanHalf * P.v);
        return Ray(P.e, dir);
      }
    `;

    // ---- Compute: one thread per pixel ----
    const wgslMain = /* wgsl */ `
      @group(0) @binding(1) var<storage, read_write> accum: array<vec4f>;

      @compute @workgroup_size(8, 8)
      fn cs_main(@builtin(global_invocation_id) id: vec3u) {
        if (id.x >= ${W}u || id.y >= ${H}u) { return; }
        // Through the pixel's center.
        let px = (f32(id.x) + 0.5) / ${W}.0 * 2.0 - 1.0;
        let py = 1.0 - (f32(id.y) + 0.5) / ${H}.0 * 2.0;
        let c = radiance(cameraRay(px, py));
        let i = id.y * ${W}u + id.x;
        accum[i] = vec4f(c, 1.0);
      }
    `;

    // ---- Display: full-screen triangle that reads the image buffer ----
    const wgslDisplay = /* wgsl */ `
      @vertex
      fn vs_main(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
        var pos = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
        return vec4f(pos[i], 0.0, 1.0);
      }

      // Same binding as accum, but read-only; the two are never used by one entry point.
      @group(0) @binding(1) var<storage, read> image: array<vec4f>;

      @fragment
      fn fs_display(@builtin(position) pos: vec4f) -> @location(0) vec4f {
        let c = P.exposure * image[u32(pos.y) * ${W}u + u32(pos.x)].rgb;
        let shown = clamp(c, vec3f(0.0), vec3f(1.0));        // anything over 1 clips to white
        return vec4f(pow(shown, vec3f(1.0 / 2.2)), 1.0);     // gamma (canvas is not sRGB)
      }
    `;

    const shaderCode = [wgslParams, wgslScene, wgslShading, wgslRadiance,
      wgslCamera, wgslMain, wgslDisplay].join("\n");

    // ======================= Host =======================

    const gui = new GUI({ title: "Controls" });
    gui.add(state, "exposure", 0.25, 4, 0.05).name("Exposure");
    gui.add(state, "maxDepth", 1, 12, 1).name("Max bounces").onChange(restart);
    gui.add(state, "maxFrames", 1, 4096, 1).name("Stop after (frames)");

    let frame = 0;
    let startTime = performance.now();
    function restart() {
      frame = 0;
      startTime = performance.now();
    }

    async function init() {
      try {
        const { device, context, format } = await initializeWebGPU("gpu-canvas");

        const module = device.createShaderModule({ code: shaderCode });
        const computePipeline = device.createComputePipeline({
          layout: "auto",
          compute: { module, entryPoint: "cs_main" },
        });
        const displayPipeline = device.createRenderPipeline({
          layout: "auto",
          vertex: { module, entryPoint: "vs_main" },
          fragment: { module, entryPoint: "fs_display", targets: [{ format }] },
        });

        // 64 bytes of fields; 80 leaves room for the ones later steps add.
        const PARAMS_SIZE = 80;
        const paramsBuffer = device.createBuffer({
          size: PARAMS_SIZE,
          usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        });
        // One vec4f (16 bytes) of color per pixel.
        const accumBuffer = device.createBuffer({ size: W * H * 16, usage: GPUBufferUsage.STORAGE });

        const entries = [
          { binding: 0, resource: { buffer: paramsBuffer } },
          { binding: 1, resource: { buffer: accumBuffer } },
        ];
        const computeBG = device.createBindGroup({ layout: computePipeline.getBindGroupLayout(0), entries });
        const displayBG = device.createBindGroup({ layout: displayPipeline.getBindGroupLayout(0), entries });

        const data = new ArrayBuffer(PARAMS_SIZE);
        const f32 = new Float32Array(data);
        const u32 = new Uint32Array(data);
        const info = document.getElementById("info");

        function step() {
          // Camera at z = 5.9 looking down -z into the room.
          f32.set([0, 1.5, 5.9, 0.34], 0);                     // e, tanHalf
          f32.set([1, 0, 0, state.exposure], 4);             // u, exposure
          f32.set([0, 1, 0], 8); u32[11] = frame;            // v, frame
          f32.set([0, 0, 1], 12); u32[15] = state.maxDepth;  // w, maxDepth
          device.queue.writeBuffer(paramsBuffer, 0, data);

          const encoder = device.createCommandEncoder();

          if (frame < state.maxFrames) {
            const compute = encoder.beginComputePass();
            compute.setPipeline(computePipeline);
            compute.setBindGroup(0, computeBG);
            compute.dispatchWorkgroups(Math.ceil(W / 8), Math.ceil(H / 8));
            compute.end();
            frame++;
            const seconds = ((performance.now() - startTime) / 1000).toFixed(1);
            info.textContent = `${frame} frames · ${seconds} s`;
          }

          // Always redraw, so exposure works even after the compute pass stops.
          const pass = encoder.beginRenderPass({
            colorAttachments: [{
              view: context.getCurrentTexture().createView(),
              clearValue: { r: 0, g: 0, b: 0, a: 1 },
              loadOp: "clear",
              storeOp: "store",
            }],
          });
          pass.setPipeline(displayPipeline);
          pass.setBindGroup(0, displayBG);
          pass.draw(3);
          pass.end();

          device.queue.submit([encoder.finish()]);
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      } catch (err) {
        console.error("WebGPU Initialization Error:", err);
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>

</html>
