<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU Sierpinski Gasket</title>
  <style>
    body { margin: 0; background: #27272a; display: flex; justify-content: center; padding: 24px; }
    canvas { width: min(90vw, 600px); aspect-ratio: 1; display: block; }
  </style>
</head>

<body>
  <canvas id="gpu-canvas"></canvas>

  <script type="module">
    import { initializeWebGPU, createBuffer, animate } from "./webgpu.js";
    import GUI from "lil-gui";

    const state = { count: 50000 };

    // Chaos game: start at a point, then repeatedly jump halfway toward a
    // randomly chosen corner of the triangle. Every point lands in the gasket.
    function generatePoints(count) {
      const corners = [[-1, -1], [0, 1], [1, -1]];
      const points = new Float32Array(count * 2);
      let p = [0, 0];
      for (let i = 0; i < count; i++) {
        const c = corners[Math.floor(Math.random() * 3)];
        p = [(p[0] + c[0]) / 2, (p[1] + c[1]) / 2];
        points[i * 2] = p[0];
        points[i * 2 + 1] = p[1];
      }
      return points;
    }

    const wgslSource = `
      @vertex
      fn vs_main(@location(0) position : vec2<f32>) -> @builtin(position) vec4<f32> {
        return vec4<f32>(position, 0.0, 1.0);
      }

      @fragment
      fn fs_main() -> @location(0) vec4<f32> {
        return vec4<f32>(1.0, 0.8, 0.2, 1.0);
      }
    `;

    const { canvas, device, context, format } = await initializeWebGPU("gpu-canvas");

    let vertexBuffer = createBuffer(device, generatePoints(state.count), GPUBufferUsage.VERTEX);

    new GUI().add(state, "count", 1000, 200000, 1000).name("Count").onChange(() => {
      vertexBuffer.destroy();
      vertexBuffer = createBuffer(device, generatePoints(state.count), GPUBufferUsage.VERTEX);
    });

    const shaderModule = device.createShaderModule({ code: wgslSource });
    const pipeline = device.createRenderPipeline({
      layout: "auto",
      vertex: {
        module: shaderModule,
        entryPoint: "vs_main",
        buffers: [{ arrayStride: 8, attributes: [{ shaderLocation: 0, offset: 0, format: "float32x2" }] }]
      },
      fragment: { module: shaderModule, entryPoint: "fs_main", targets: [{ format }] },
      primitive: { topology: "point-list" },
      // animate() always attaches a depth buffer, so the pipeline must declare one.
      depthStencil: { format: "depth24plus", depthWriteEnabled: false, depthCompare: "always" }
    });

    animate({
      canvas,
      device,
      context,
      onFrame: ({ renderPass }) => {
        renderPass.setPipeline(pipeline);
        renderPass.setVertexBuffer(0, vertexBuffer);
        renderPass.draw(state.count);
      }
    });
  </script>
</body>

</html>
