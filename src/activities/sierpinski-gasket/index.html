<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css"/>
  <title>Sample Triangle</title>
</head>

<body style="display: flex; gap: 1rem; flex-flow: column nowrap; align-items: center;">
<canvas id="myCanvas" style="width: 600px; height: 400px; border: 1px solid #444;"></canvas>
<div style="display: flex; gap: 1.5rem;" id="controlContainer">
  <label for="scaleSlider">Scale:
    <input id="scaleSlider" type="range" min="0.1" max="2.0" step="0.1" value="1.0"/>
  </label>
  <label for="speedSlider">Speed:
    <input id="speedSlider" type="range" min="0.0" max="5.0" step="0.1" value="1.0"/>
  </label>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
